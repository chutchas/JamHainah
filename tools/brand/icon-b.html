<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /*
    LINE ครอบรูปโปรไฟล์เป็นวงกลม มุมทั้งสี่จึงหายไปเสมอ
    ตัวอักษรต้องอยู่ในวงกลมด้านใน ไม่ใช่แค่อยู่ในสี่เหลี่ยม
  */
  body {
    width: 640px; height: 640px;
    display: flex; align-items: center; justify-content: center;
    background: #ffffff;
    font-family: 'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /*
    ใช้ตัวอักษรแทนรูป เพราะ LINE ย่อไอคอนนี้เหลือราว 60px ในรายการแชท
    รูปที่มีรายละเอียดจะกลายเป็นจุดเขียว ๆ ตรงนั้น ตัวอักษรไม่กลาย
    และ "จำ" คือคำที่สินค้านี้สัญญาไว้ทั้งคำ
  */
  .glyph {
    font-size: 290px; font-weight: 600;
    background: linear-gradient(135deg, #0b8a72 0%, #22a74c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1; letter-spacing: -.02em;
    transform: translateY(14px);
  }
</style>
<div class="glyph">จำ</div>
