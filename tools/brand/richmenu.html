<!doctype html>
<meta charset="utf-8">
<style>
  /* ไล่สีเดียวกับไอคอน — เขียวอมฟ้าเข้มไปเขียวมิ้นต์ ทแยงมุม องศาเดียวกันทั้งชุด */
  :root { --teal: #0b8a72; --mint: #4fc49b; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2500px; height: 843px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    font-family: 'Mali', sans-serif;
    -webkit-font-smoothing: antialiased;

    /*
      พื้นหลังเป็นภาพของ Tum — สัดส่วนสูงกว่า 2500x843 อยู่เล็กน้อย
      จึงต้องตัดออก 178px และตัดจากขอบล่าง (จัดชิดบน)
      เพื่อดันคลื่นลงไปใกล้ขอบล่าง เหลือพื้นที่โล่งด้านบนให้การ์ด
      ถ้าตัดจากขอบบนแทน คลื่นจะลอยอยู่กลางภาพ แล้วครึ่งล่างจะว่างเปล่า
    */
    background: url('richmenu_background.png') center top / cover no-repeat, #eaf7f4;
  }

  .cell { display: flex; align-items: center; justify-content: center; padding-bottom: 72px; }

  /*
    การ์ดขาวเล็กกว่าพื้นที่กดจริง โดยตั้งใจ
    ขอบการ์ดไม่ใช่ขอบของปุ่ม — ทำให้เท่ากันเมื่อไหร่ คนจะเล็งกดขอบพอดี
    แล้วพลาดไปโดนช่องข้าง ๆ เพราะนิ้วกว้างกว่าที่ตาเห็น
  */
  .card {
    position: relative;
    width: 668px; height: 478px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    /*
      กระจกฝ้า ไม่ใช่ขาวทึบ — ยังเห็นใบไม้กับคลื่นข้างหลังจาง ๆ
      blur ทำให้ลายพื้นหลังไม่มากวนตัวหนังสือ แต่ยังรู้ว่ามีอะไรอยู่ข้างหลัง
    */
    background: rgba(255, 255, 255, .55);
    backdrop-filter: blur(24px) saturate(1.15);
    border-radius: 66px;
    box-shadow: 0 12px 34px rgba(11, 138, 114, .10);
  }

  /*
    เส้นประจุดกลม — border ของ CSS ทำไล่สีไม่ได้
    จึงวาดเป็น rect ของ SVG แล้วใช้ dasharray ช่วงเส้น 0 กับปลายมน
    ได้จุดกลมเรียงกัน ไม่ใช่ขีดสั้น ๆ แบบ border: dotted
  */
  .frame { position: absolute; inset: 0; }

  /*
    มาสคอตโผล่ที่มุมบนขวาของการ์ด เลยขอบออกมานิดหน่อย
    ให้รู้สึกเหมือนสติกเกอร์แปะทับ ไม่ใช่ภาพที่ถูกใส่ไว้ในกรอบ
    เอียงคนละองศาเล็กน้อย ชุดนี้จะได้ไม่ดูเหมือนแสตมป์ที่ปั๊มด้วยแม่พิมพ์เดียว
  */
  .mascot {
    position: absolute; top: -70px; right: -34px;
    width: 232px; height: 232px;
    filter: drop-shadow(0 10px 18px rgba(11, 138, 114, .18));
  }
  .cell:nth-child(2) .mascot { transform: rotate(6deg); }
  .cell:nth-child(3) .mascot { transform: rotate(-5deg); }
  .cell:nth-child(4) .mascot { transform: rotate(4deg); }

  .ico { width: 196px; height: 196px; }
  .label { font-size: 78px; font-weight: 700; line-height: 1.25; color: var(--teal); }
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#4fc49b"/>
    </linearGradient>
  </defs>
</svg>

<div class="cell">
  <div class="card">
    <svg class="frame" viewBox="0 0 668 478">
      <rect x="20" y="20" width="628" height="438" rx="56"
            fill="none" stroke="url(#gd)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="0 30"/>
    </svg>
    <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#gd)" stroke-width="6.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 36h10l6-8h20l6 8h10a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V42a6 6 0 0 1 6-6z"/>
      <circle cx="48" cy="56" r="13"/>
    </svg>
    <img class="mascot" src="../../public/mascot/06-peek.png" alt="">
    <div class="label">เพิ่มเอกสาร</div>
  </div>
</div>

            stroke-linecap="round" stroke-dasharray="0 30"/>
    </svg>
    <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#gd)" stroke-width="6.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 16h22l14 14v48a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z"/>
      <path d="M56 16v14h14"/>
      <path d="M40 54h18M40 66h12"/>

    </svg>
    <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#gd)" stroke-width="6.5"
