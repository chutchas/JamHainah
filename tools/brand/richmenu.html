<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    /* ไล่สีทแยงมุม เขียวอมฟ้าไปเขียวสด — ชุดเดียวกับไอคอนในแชท */
    --teal: #0b8a72;
    --green: #22a74c;
    --ink: #16211b;
    --ink-2: #5d6b64;
    --line: #e2e8e3;
    --wash: #f3f8f4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2500px; height: 843px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: #fff;
    font-family: 'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 52px;
    position: relative;
  }
  .cell + .cell::before {
    content: ''; position: absolute; left: 0; top: 170px; bottom: 170px;
    width: 3px; background: var(--line);
  }
  /* ช่องแรกคือสิ่งที่อยากให้เขาทำที่สุด — พื้นอ่อน ๆ ดึงตาโดยไม่ต้องตะโกน */
  .cell.lead { background: var(--wash); }
  .ico { width: 210px; height: 210px; }
  .label { font-size: 76px; font-weight: 600; color: var(--ink); letter-spacing: .01em; }
  .sub { font-size: 50px; color: var(--ink-2); margin-top: -30px; }
</style>

<div class="cell lead">
  <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#g1)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#22a74c"/></linearGradient></defs>
    <path d="M22 36h10l6-8h20l6 8h10a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V42a6 6 0 0 1 6-6z"/>
    <circle cx="48" cy="56" r="13"/>
  </svg>
  <div class="label">เพิ่มเอกสาร</div>
</div>

<div class="cell">
  <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#g2)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#22a74c"/></linearGradient></defs>
    <path d="M34 16h22l14 14v48a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z"/>
    <path d="M56 16v14h14"/>
    <path d="M40 54h18M40 66h12"/>
  </svg>
  <div class="label">เอกสารของฉัน</div>
</div>

<div class="cell">
  <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#g3)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#22a74c"/></linearGradient></defs>
    <path d="M24 26h48a7 7 0 0 1 7 7v26a7 7 0 0 1-7 7H46L30 80V66h-6a7 7 0 0 1-7-7V33a7 7 0 0 1 7-7z"/>
  </svg>
  <div class="label">คุยกับคน</div>
</div>
