<!doctype html>
<meta charset="utf-8">
<style>
  /* ไล่สีเดียวกับไอคอน — เขียวอมฟ้าเข้มไปเขียวมิ้นต์ ทแยงมุม องศาเดียวกันทั้งชุด */
  :root { --teal: #0b8a72; --mint: #4fc49b; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2500px; height: 843px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    font-family: 'Mali', sans-serif;
    -webkit-font-smoothing: antialiased;

    /*
      พื้นหลังเป็นภาพของ Tum — สัดส่วนสูงกว่า 2500x843 อยู่เล็กน้อย
      จึงต้องตัดออก 178px และตัดจากขอบล่าง (จัดชิดบน)
      เพื่อดันคลื่นลงไปใกล้ขอบล่าง เหลือพื้นที่โล่งด้านบนให้ไอคอนกับตัวอักษร
      ถ้าตัดจากขอบบนแทน คลื่นจะลอยอยู่กลางภาพ แล้วครึ่งล่างจะว่างเปล่า
    */
    background: url('richmenu_background.png') center top / cover no-repeat, #eaf7f4;
  }

  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    /*
      ดันขึ้นจากกึ่งกลางเล็กน้อย เพราะส่วนล่างของพื้นหลังเป็นคลื่นสีเข้ม
      ตัวอักษรเขียวทับตรงนั้นจะอ่านยาก
    */
    padding-bottom: 70px;
  }

  .ico { width: 250px; height: 250px; }

  /*
    ตัวอักษรใช้สีเดียว ไม่ไล่สี
    ปลายไล่สีเป็นเขียวมิ้นต์อ่อน ซึ่งบนพื้นหลังอ่อนแบบนี้แทบอ่านไม่ออก
    ไอคอนยังไล่สีได้เพราะเป็นรูปทรง ไม่ใช่ตัวหนังสือที่ต้องอ่าน
  */
  .label {
    font-size: 92px; font-weight: 700; line-height: 1.25;
    color: var(--teal);
    /* เงาขาวฟุ้งบาง ๆ กันตัวอักษรจมไปกับลายพื้นหลัง */
    text-shadow: 0 0 14px rgba(255,255,255,.95), 0 0 28px rgba(255,255,255,.85);
  }
</style>

<div class="cell">
  <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#g1)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 36h10l6-8h20l6 8h10a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V42a6 6 0 0 1 6-6z"/>
    <circle cx="48" cy="56" r="13"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#4fc49b"/>
    </linearGradient></defs>
  </svg>
  <div class="label">เพิ่มเอกสาร</div>
</div>

<div class="cell">
  <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#g2)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 16h22l14 14v48a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z"/>
    <path d="M56 16v14h14"/>
    <path d="M40 54h18M40 66h12"/>
    <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#4fc49b"/>
    </linearGradient></defs>
  </svg>
  <div class="label">เอกสารของฉัน</div>
</div>

<div class="cell">
  <svg class="ico" viewBox="0 0 96 96" fill="none" stroke="url(#g3)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 26h48a7 7 0 0 1 7 7v26a7 7 0 0 1-7 7H46L30 80V66h-6a7 7 0 0 1-7-7V33a7 7 0 0 1 7-7z"/>
    <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8a72"/><stop offset="1" stop-color="#4fc49b"/>
    </linearGradient></defs>
  </svg>
  <div class="label">คุยกับคน</div>
</div>
